# Production-parity option. Local dev defaults to SQLite with no Docker
# required (see backend/.env and README) — use this when you want to run
# against real PostgreSQL, e.g. before a demo.
#
# NOTE: reviewed carefully (migration-on-startup, SPA routing, env var
# wiring - see README "Limitations") but never run end-to-end, since
# Docker Desktop isn't installed on the machine this was built on. If you
# hit an issue running this for real, it's likely something this review
# couldn't catch without actually executing it.
#
# Usage: docker compose up --build
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: retailiq
      POSTGRES_PASSWORD: retailiq
      POSTGRES_DB: retailiq
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U retailiq"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg2://retailiq:retailiq@postgres:5432/retailiq
      JWT_SECRET: change-this-to-a-long-random-string
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 60
      CORS_ORIGINS: http://localhost:5173
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres_data:
